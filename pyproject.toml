[project]
name = "testkit"
version = "0.1.0"
description = "HYSTERESIS 前端测试平台：iPhone(WebKit) 优先的移动端测试环境"
readme = "README.md"
authors = [
    { name = "romal", email = "romaluo000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62.0",
]

[project.scripts]
serve = "testkit.server:main"
preview = "testkit.preview:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
